name: Build macOS DMG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller Pillow
          pip install -r requirements.txt

      - name: Convert icon to icns
        run: |
          python3 -c "
          from PIL import Image
          import os, subprocess, shutil

          # Use Logo.png as source (higher res), fall back to .ico
          src = 'Logo.png' if os.path.exists('Logo.png') else 'app_icon.ico'
          img = Image.open(src).convert('RGBA')

          iconset = 'app_icon.iconset'
          os.makedirs(iconset, exist_ok=True)

          sizes = [16, 32, 64, 128, 256, 512, 1024]
          names = {
              16:   'icon_16x16.png',
              32:   'icon_16x16@2x.png',
              64:   'icon_32x32@2x.png',
              128:  'icon_128x128.png',
              256:  'icon_128x128@2x.png',
              512:  'icon_512x512.png',
              1024: 'icon_512x512@2x.png',
          }
          # Also need these exact sizes
          extra = {
              32:  'icon_32x32.png',
              256: 'icon_256x256.png',
          }

          for s in sizes:
              resized = img.resize((s, s), Image.LANCZOS)
              if s in names:
                  resized.save(os.path.join(iconset, names[s]))
              if s in extra:
                  resized.save(os.path.join(iconset, extra[s]))

          subprocess.run(['iconutil', '-c', 'icns', iconset, '-o', 'app_icon.icns'], check=True)
          shutil.rmtree(iconset)
          print('Created app_icon.icns')
          "

      - name: Build with PyInstaller
        run: python -m PyInstaller --clean --noconfirm RiffPilot_mac.spec

      - name: Create DMG
        run: |
          DMG_TEMP="dist/dmg_temp"
          mkdir -p "${DMG_TEMP}"
          cp -R "dist/Riff Pilot.app" "${DMG_TEMP}/"
          ln -s /Applications "${DMG_TEMP}/Applications"
          hdiutil create -volname "Riff Pilot" \
            -srcfolder "${DMG_TEMP}" \
            -ov -format UDZO \
            "dist/RiffPilot_1.0.0_macOS.dmg"
          rm -rf "${DMG_TEMP}"

      - name: Upload DMG to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 "dist/RiffPilot_1.0.0_macOS.dmg" --clobber

      - name: Upload DMG as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: RiffPilot_1.0.0_macOS
          path: dist/RiffPilot_1.0.0_macOS.dmg
